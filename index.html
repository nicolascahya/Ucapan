<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ucapan Manis untuk Kamu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ucapan Manis untuk Kamu</h1>
        <p>Masukkan nama kamu yang spesial:</p>
        <input type="text" id="nama" placeholder="Nama kamu">
        <button onclick="tampilkanUcapan()">Tampilkan Ucapan</button>

        <div id="ucapan" style="display:none;">
            <p id="pesan"></p>
            <button onclick="senyum()">Tekan untuk Senyum</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
